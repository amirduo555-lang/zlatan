<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 1. 배경 이미지 (파일명: bg1.png) */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 2. 메인 이미지 컨테이너 */
        .hero-content {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        /* 3. 메인 이미지 (파일명: img1.png) */
        .hero-content img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <img src="img1.png" alt="메인 이미지">
        </div>
    </section>

</body>
</html>
