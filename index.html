<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜딩페이지1</title>
    <style>
        /* 기본 여백 완전 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        /* 1. 배경 이미지 꽉 채우기 */
        .hero-section {
            width: 100%;
            height: 100vh;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. 메인 이미지 (600px 이상에선 600px, 이하라면 가로 꽉 참) */
        .hero-content {
            width: 100%;
            max-width: 600px;
        }

        .hero-content img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <img src="img1.png" alt="사진1">
        </div>
    </section>

</body>
</html>

</body>
</html>
