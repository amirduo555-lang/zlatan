<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜딩페이지</title>
    <style>
        /* 여백 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
        }

        /* ---------------- [첫 번째 섹션] ---------------- */
        .hero-section-1 {
            width: 100%;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-content {
            width: 100%;
            max-width: 600px;
        }

        .hero-content img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ---------------- [두 번째 섹션] ---------------- */
        .hero-section-2 {
            width: 100%;
            /* 배경 그라데이션 (그림자 제거됨) */
            background: linear-gradient(96deg, #424242 0%, #272727 43.75%, #0C0C0C 100%), 
                        linear-gradient(139deg, rgba(96, 6, 2, 0.75) 10.86%, rgba(12, 12, 12, 0.75) 28.13%, rgba(0, 0, 0, 0.75) 65.57%, rgba(54, 9, 7, 0.75) 78.26%), 
                        #000;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 두 번째 섹션 내 이미지 스타일 (간격 없음, 최대 600px) */
        .hero-section-2 img {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 첫 번째 섹션 -->
    <section class="hero-section-1">
        <div class="hero-content">
            <img src="img1.png" alt="사진1">
        </div>
    </section>

    <!-- 두 번째 섹션 -->
    <section class="hero-section-2">
        <img src="img2.png" alt="사진2">
        <img src="img3.png" alt="사진3">
    </section>

</body>
</html>

</body>
</html>
