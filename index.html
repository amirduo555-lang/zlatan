<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 번째 섹션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 1. 배경 이미지가 항상 화면에 꽉 차는 섹션 */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh; /* 화면 높이에 꽉 차게 */
            
            /* 배경 이미지 설정 (파일명: 배경1.png) */
            background-image: url('배경1.png');
            background-size: cover;      /* 화면에 꽉 차게 비율 유지 */
            background-position: center; /* 가운데 정렬 */
            background-repeat: no-repeat;
            
            /* 내부 콘텐츠 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 2. 그 위에 올라가는 이미지 컨테이너 */
        .hero-content {
            position: relative;
            width: 100%;
            max-width: 600px;   /* 600px 이상일 때 최대 600px 고정 */
        }

        /* 3. 실제 이미지 스타일 (파일명: 사진1.png) */
        .hero-content img {
            width: 100%;        /* 600px 이하일 때는 가로에 꽉 찹니다 */
            height: auto;       /* 비율 유지 */
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <img src="사진1.png" alt="메인 이미지">
        </div>
    </section>

</body>
</html>
